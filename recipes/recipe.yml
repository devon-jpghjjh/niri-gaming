---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: niri-gaming
description: Bazzite-based gaming image with niri + Noctalia, LACT, Faugus Launcher, Brave Origin, Ghostty and yazi.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      copr:
        - ilyaz/LACT
        - faugus/faugus-launcher
        - scottames/ghostty
        - lihaohong/yazi
        - lionheartp/Hyprland
    install:
      packages:
        - lact # AMD GPU control (RX 9070)
        - faugus-launcher # Windows-game launcher via UMU
        - ghostty # terminal
        - yazi # terminal file manager
        - fd-find # yazi deps
        - ripgrep
        - fzf
        - zoxide
        - poppler-utils
        - noctalia-git # niri shell (F43 has no 'noctalia' package yet)
        - brave-origin # Brave's minimalist browser
        - micro # editor
        - neovim # editor
        - kde-connect # phone integration (already on KDE base)
    remove:
      packages:
        - xwaylandvideobridge # opens a blank window under niri

  - type: dnf
    install:
      packages:
        - niri # scrollable-tiling Wayland compositor
        - xdg-desktop-portal-gnome # portals (screen capture etc.) under niri
        - wlsunset # night light
        - playerctl # media-key control
        - qt6ct # Qt theming without KDE settings

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install: # installed system-wide on first boot
          - org.telegram.desktop
          - io.github.kolunmi.Bazaar

  - type: systemd
    system:
      enabled:
        - lactd

  - type: signing
