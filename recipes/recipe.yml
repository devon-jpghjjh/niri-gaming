---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: niri-gaming
description: d_ARK — Bazzite-based gaming image with niri + Noctalia, LACT, Faugus Launcher, Brave Origin, Ghostty and yazi.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

labels:
  org.opencontainers.image.title: d_ARK
  org.opencontainers.image.description: d_ARK — Bazzite-based gaming image with niri + Noctalia, LACT, Faugus Launcher, Brave Origin, Ghostty and yazi.
  org.opencontainers.image.source: https://github.com/devon-jpghjjh/niri-gaming
  io.artifacthub.package.logo-url: https://raw.githubusercontent.com/devon-jpghjjh/niri-gaming/main/files/branding/usr/share/pixmaps/d_ARK-logo.png
  io.artifacthub.package.keywords: bazzite, gaming, niri, noctalia, atomic, ublue, d_ARK
  io.artifacthub.package.maintainers: '[{"name":"devon"}]'

modules:
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      copr:
        - ilyaz/LACT
        - faugus/faugus-launcher
        - scottames/ghostty
        - lihaohong/yazi
        - lionheartp/Hyprland
    install:
      packages:
        - lact # AMD GPU control (RX 9070)
        - faugus-launcher # Windows-game launcher via UMU
        - ghostty # terminal
        - yazi # terminal file manager
        - fd-find # yazi deps
        - ripgrep
        - fzf
        - zoxide
        - poppler-utils
        - noctalia-git # niri shell (F43 has no 'noctalia' package yet)
        - noctalia-greeter # login greeter for greetd
        - brave-origin # Brave's minimalist browser
        - micro # editor
        - neovim # editor
        - kde-connect # phone integration (runs standalone, autostarted from niri)
        - greetd # display manager for the Noctalia greeter
        - protontricks # tweak Proton prefixes
        - corectrl # alternative AMD GPU tuning
    remove:
      packages:
        - xwaylandvideobridge # opens a blank window under niri
        - sddm
        - sddm-breeze
        - sddm-kcm
        - plasma-desktop
        - plasma-workspace
        - kwin
        - kdeplasma-addons
        - polkit-kde-agent-1
        - dolphin
        - konsole
        - kate
        - ark
        - gwenview
        - okular
        - spectacle
        - kcalc
        - krunner
        - plasma-nm
        - plasma-pa
        - plasma-disks
        - plasma-systemmonitor
        - kinfocenter
        - kwalletmanager
        - ksshaskpass

  - type: dnf
    install:
      packages:
        - niri # scrollable-tiling Wayland compositor
        - xdg-desktop-portal-gnome # portals (screen capture etc.) under niri
        - wlsunset # night light
        - playerctl # media-key control
        - qt6ct # Qt theming without KDE settings

  - type: justfiles

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install: # installed system-wide on first boot
          - org.telegram.desktop
          - io.github.kolunmi.Bazaar

  - type: systemd
    system:
      enabled:
        - greetd
        - lactd

  - type: os-release
    properties:
      NAME: d_ARK
      PRETTY_NAME: d_ARK
      LOGO: d_ARK-logo-icon

  - type: files
    files:
      - source: branding
        destination: /

  - type: script
    scripts:
      - branding.sh

  - type: signing
