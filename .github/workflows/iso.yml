name: iso
on:
  workflow_dispatch:
  schedule:
    - cron: "30 07 * * *" # after the 06:00 UTC image build
permissions:
  contents: read
jobs:
  iso:
    name: Build netinstall ISO
    runs-on: ubuntu-latest
    env:
      ARCH: x86_64
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: d_ARK
      IMAGE_TAG: latest
      VERSION: "44" # Fedora major of current bazzite:stable
    steps:
      - name: Build ISO
        uses: devon-jpghjjh/build-container-installer@main
        id: build
        with:
          arch: ${{ env.ARCH }}
          image_name: ${{ env.IMAGE_NAME }}
          image_repo: ${{ env.IMAGE_REPO }}
          image_src: docker://ghcr.io/${{ github.repository_owner }}/niri-gaming:latest
          image_tag: ${{ env.IMAGE_TAG }}
          version: ${{ env.VERSION }}
          iso_name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-${{ env.VERSION }}.iso
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          compression-level: 0
